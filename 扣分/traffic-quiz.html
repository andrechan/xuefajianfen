<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通違法記分測驗</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 12px;
  }
  .container {
    background: #fff; border-radius: 16px;
    max-width: 720px; width: 100%;
    padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  h1 { text-align: center; color: #1e3c72; margin-bottom: 6px; font-size: 26px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
  .stats-bar {
    display: flex; justify-content: space-around; margin-bottom: 20px;
    background: #f0f4f8; border-radius: 10px; padding: 12px;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 22px; font-weight: bold; color: #1e3c72; }
  .stat .label { font-size: 12px; color: #777; }
  .stat.ok .num { color: #2e8b57; }
  .stat.err .num { color: #c0392b; }
  .question-card {
    background: #f8fafc; border-left: 5px solid #2a5298;
    border-radius: 8px; padding: 18px; margin-bottom: 20px;
    font-size: 16px; line-height: 1.7; color: #333;
  }
  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
  .option-btn {
    padding: 16px 8px; font-size: 22px; font-weight: bold;
    border: 2px solid #2a5298; border-radius: 10px;
    background: #fff; color: #2a5298; cursor: pointer; transition: all .15s;
  }
  .option-btn:hover { background: #2a5298; color: #fff; }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { background: #2e8b57; border-color: #2e8b57; color: #fff; }
  .option-btn.wrong { background: #c0392b; border-color: #c0392b; color: #fff; }
  .feedback { min-height: 28px; text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 14px; }
  .feedback.ok { color: #2e8b57; }
  .feedback.err { color: #c0392b; }
  .next-btn {
    display: block; margin: 0 auto; padding: 12px 48px;
    background: #2a5298; color: #fff; border: none; border-radius: 24px;
    font-size: 16px; cursor: pointer;
  }
  .next-btn:hover { background: #1e3c72; }
  .hidden { display: none; }
  .history-panel { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 16px; }
  .history-panel h3 { font-size: 15px; color: #555; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
  th { background: #f0f4f8; }
  .score-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; color: #fff; font-size: 12px; font-weight: bold; }
  .s1{background:#8e9aaf}.s3{background:#27ae60}.s6{background:#e67e22}.s9{background:#d35400}.s12{background:#c0392b}
</style>
</head>
<body>
<div class="container">
  <h1>🚦 交通違法記分測驗</h1>
  <div class="subtitle">根據題目描述，選擇應記（扣）的分數</div>

  <div class="stats-bar">
    <div class="stat"><div class="num" id="qTotal">0</div><div class="label">已答題數</div></div>
    <div class="stat ok"><div class="num" id="qCorrect">0</div><div class="label">正確</div></div>
    <div class="stat err"><div class="num" id="qWrong">0</div><div class="label">錯誤</div></div>
    <div class="stat"><div class="num" id="qAccuracy">--</div><div class="label">正確率</div></div>
  </div>

  <div class="question-card" id="questionText">載入中...</div>

  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn hidden" id="nextBtn">下一題 ▶</button>

  <div class="history-panel">
    <h3>📋 題目統計（按優先級排序：錯誤次數 &gt; 未出題 &gt; 正確次數）</h3>
    <table>
      <thead><tr><th>分值</th><th>題目（節選）</th><th>出題</th><th>對</th><th>錯</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
  </div>
</div>

<script>
const DATA = `12|（一）飲酒後駕駛機動車的
12|（二）造成致人輕傷以上或者死亡的交通事故後逃逸，尚不構成犯罪的
12|（三）使用偽造、變造的機動車號牌、行駛證、駕駛證、校車標牌或者使用其他機動車號牌、行駛證的
12|（四）駕駛校車、公路客運汽車、旅遊客運汽車載人超過核定人數百分之二十以上，或者駕駛其他載客汽車載人超過核定人數百分之百以上的
12|（五）駕駛校車、中型以上載客載貨汽車、危險物品運輸車輛在高速公路、城市快速路上行駛超過規定時速百分之二十以上，或者駕駛其他機動車在高速公路、城市快速路上行駛超過規定時速百分之五十以上的
12|（六）駕駛機動車在高速公路、城市快速路上倒車、逆行、穿越中央分隔帶掉頭的
12|（七）代替實際機動車駕駛人接受交通違法行為處罰和記分牟取經濟利益的
9|（一）駕駛7座以上載客汽車載人超過核定人數百分之五十以上未達到百分之百的
9|（二）駕駛校車、中型以上載客載貨汽車、危險物品運輸車輛在高速公路、城市快速路以外的道路上行駛超過規定時速百分之五十以上的
9|（三）駕駛機動車在高速公路或者城市快速路上違法停車的
9|（四）駕駛未懸掛機動車號牌或者故意遮擋、汙損機動車號牌的機動車上道路行駛的
9|（五）駕駛與准駕車型不符的機動車的
9|（六）未取得校車駕駛資格駕駛校車的
9|（七）連續駕駛中型以上載客汽車、危險物品運輸車輛超過4小時未停車休息或者停車休息時間少於20分鐘的
6|（一）駕駛校車、公路客運汽車、旅遊客運汽車載人超過核定人數未達到百分之二十，或者駕駛7座以上載客汽車載人超過核定人數百分之二十以上未達到百分之五十，或者駕駛其他載客汽車載人超過核定人數百分之五十以上未達到百分之百的
6|（二）駕駛校車、中型以上載客載貨汽車、危險物品運輸車輛在高速公路、城市快速路上行駛超過規定時速未達到百分之二十，或者在高速公路、城市快速路以外的道路上行駛超過規定時速百分之二十以上未達到百分之五十的
6|（三）駕駛校車、中型以上載客載貨汽車、危險物品運輸車輛以外的機動車在高速公路、城市快速路上行駛超過規定時速百分之二十以上未達到百分之五十，或者在高速公路、城市快速路以外的道路上行駛超過規定時速百分之五十以上的
6|（四）駕駛載貨汽車載物超過最大允許總品質百分之五十以上的
6|（五）駕駛機動車載運爆炸物品、易燃易爆化學物品以及劇毒、放射性等危險物品，未按指定的時間、路線、速度行駛或者未懸掛警示標誌並採取必要的安全措施的
6|（六）駕駛機動車運載超限的不可解體的物品，未按指定的時間、路線、速度行駛或者未懸掛警示標誌的
6|（七）駕駛機動車運輸危險化學品，未經批准進入危險化學品運輸車輛限制通行的區域的
6|（八）駕駛機動車不按交通信號燈指示通行的
6|（九）機動車駕駛證被暫扣或者扣留期間駕駛機動車的
6|（十）造成致人輕微傷或者財產損失的交通事故後逃逸，尚不構成犯罪的
6|（十一）駕駛機動車在高速公路或者城市快速路上違法佔用應急車道行駛的
3|（一）駕駛校車、公路客運汽車、旅遊客運汽車、7座以上載客汽車以外的其他載客汽車載人超過核定人數百分之二十以上未達到百分之五十的
3|（二）駕駛校車、中型以上載客載貨汽車、危險物品運輸車輛以外的機動車在高速公路、城市快速路以外的道路上行駛超過規定時速百分之二十以上未達到百分之五十的
3|（三）駕駛機動車在高速公路或者城市快速路上不按規定車道行駛的
3|（四）駕駛機動車不按規定超車、讓行，或者在高速公路、城市快速路以外的道路上逆行的
3|（五）駕駛機動車遇前方機動車停車排隊或者緩慢行駛時，借道超車或者佔用對面車道、穿插等候車輛的
3|（六）駕駛機動車有撥打、接聽手持電話等妨礙安全駕駛的行為的
3|（七）駕駛機動車行經人行橫道不按規定減速、停車、避讓行人的
3|（八）駕駛機動車不按規定避讓校車的
3|（九）駕駛載貨汽車載物超過最大允許總品質百分之三十以上未達到百分之五十的，或者違反規定載客的
3|（十）駕駛不按規定安裝機動車號牌的機動車上道路行駛的
3|（十一）在道路上車輛發生故障、事故停車後，不按規定使用燈光或者設置警告標誌的
3|（十二）駕駛未按規定定期進行安全技術檢驗的公路客運汽車、旅遊客運汽車、危險物品運輸車輛上道路行駛的
3|（十三）駕駛校車上道路行駛前，未對校車車況是否符合安全技術要求進行檢查，或者駕駛存在安全隱患的校車上道路行駛的
3|（十四）連續駕駛載貨汽車超過4小時未停車休息或者停車休息時間少於20分鐘的
3|（十五）駕駛機動車在高速公路上行駛低於規定最低時速的
1|（一）駕駛校車、中型以上載客載貨汽車、危險物品運輸車輛在高速公路、城市快速路以外的道路上行駛超過規定時速百分之十以上未達到百分之二十的
1|（二）駕駛機動車不按規定會車，或者在高速公路、城市快速路以外的道路上不按規定倒車、掉頭的
1|（三）駕駛機動車不按規定使用燈光的
1|（四）駕駛機動車違反禁令標誌、禁止標線指示的
1|（五）駕駛機動車載貨長度、寬度、高度超過規定的
1|（六）駕駛載貨汽車載物超過最大允許總品質未達到百分之三十的
1|（七）駕駛未按規定定期進行安全技術檢驗的公路客運汽車、旅遊客運汽車、危險物品運輸車輛以外的機動車上道路行駛的
1|（八）駕駛擅自改變已登記的結構、構造或者特徵的載貨汽車上道路行駛的
1|（九）駕駛機動車在道路上行駛時，機動車駕駛人未按規定系安全帶的
1|（十）駕駛摩托車，不戴安全頭盔的`;

const QUESTIONS = DATA.trim().split('\n').map((line, i) => {
  const [score, text] = line.split('|');
  return { id: i, score: parseInt(score), text: text, asked: 0, correct: 0, wrong: 0 };
});

const SAVE_KEY = 'trafficQuizStats_v1';
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved && Array.isArray(saved)) {
    saved.forEach(s => {
      const q = QUESTIONS.find(q => q.id === s.id);
      if (q) { q.asked = s.a || 0; q.correct = s.c || 0; q.wrong = s.w || 0; }
    });
  }
} catch (e) {}
function saveStats() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(
      QUESTIONS.map(q => ({ id: q.id, a: q.asked, c: q.correct, w: q.wrong }))
    ));
  } catch (e) {}
}

let current = null;
let answered = false;

function pickQuestion() {
  const pool = QUESTIONS.filter(q => q.asked === 0);
  let chosen;
  if (pool.length > 0) {
    chosen = pool[Math.floor(Math.random() * pool.length)];
  } else {
    const sorted = [...QUESTIONS].sort((a, b) =>
      (b.wrong - a.wrong) || (a.correct - b.correct) || (Math.random() - 0.5));
    const topPool = sorted.filter(q => q.wrong === sorted[0].wrong);
    chosen = topPool[Math.floor(Math.random() * topPool.length)];
  }
  return chosen;
}

function renderTable() {
  const sorted = [...QUESTIONS].sort((a, b) =>
    (b.wrong - a.wrong) || (a.asked - b.asked) || (a.correct - b.correct));
  document.getElementById('historyBody').innerHTML = sorted.map(q =>
    `<tr><td><span class="score-badge s${q.score}">${q.score}分</span></td>
     <td>${q.text.length > 45 ? q.text.slice(0, 45) + '…' : q.text}</td>
     <td>${q.asked}</td><td style="color:#2e8b57">${q.correct}</td>
     <td style="color:#c0392b">${q.wrong}</td></tr>`).join('');
}

function updateStats() {
  const total = QUESTIONS.reduce((s, q) => s + q.asked, 0);
  const correct = QUESTIONS.reduce((s, q) => s + q.correct, 0);
  const wrong = QUESTIONS.reduce((s, q) => s + q.wrong, 0);
  document.getElementById('qTotal').textContent = total;
  document.getElementById('qCorrect').textContent = correct;
  document.getElementById('qWrong').textContent = wrong;
  document.getElementById('qAccuracy').textContent = total ? Math.round(correct / total * 100) + '%' : '--';
}

function nextQuestion() {
  answered = false;
  current = pickQuestion();
  current.asked++;
  saveStats();
  document.getElementById('questionText').textContent = current.text;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.add('hidden');
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  [1, 3, 6, 9, 12].forEach(score => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = score + '分';
    btn.onclick = () => chooseAnswer(score, btn);
    opts.appendChild(btn);
  });
  updateStats();
  renderTable();
}

function chooseAnswer(score, btn) {
  if (answered) return;
  answered = true;
  const ok = score === current.score;
  if (ok) current.correct++; else current.wrong++;
  saveStats();
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (parseInt(b.textContent) === current.score) b.classList.add('correct');
  });
  if (!ok) btn.classList.add('wrong');
  const fb = document.getElementById('feedback');
  fb.textContent = ok ? '✔ 回答正確！' : `✘ 回答錯誤，正確答案是 ${current.score} 分`;
  fb.className = 'feedback ' + (ok ? 'ok' : 'err');
  document.getElementById('nextBtn').classList.remove('hidden');
  updateStats();
  renderTable();
}

document.getElementById('nextBtn').onclick = nextQuestion;
nextQuestion();
</script>
</body>
</html>
